<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetSync Pro | Select Portal</title>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

<style>
/* SAME CSS (unchanged) */
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

body { 
    font-family: 'Plus Jakarta Sans', sans-serif; 
    background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #1e293b);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.glass-panel {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 900px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

/* (KEEP ALL YOUR CSS SAME — trimmed here for readability) */
.hidden { display: none !important; }

</style>
</head>

<body>

<div class="glass-panel">

<!-- Selection -->
<div id="selectionScreen">
    <h1>FleetSync Pro</h1>
    <button onclick="showUserLogin()">User Portal</button>
    <button onclick="showAdminLogin()">Admin Portal</button>
</div>

<!-- User Login -->
<div id="userLoginScreen" class="hidden">
    <button onclick="showSelection()">Back</button>

    <div id="userError" class="hidden"></div>

    <form id="userLoginForm">
        <input id="userUsername" placeholder="Username" required>
        <input id="userPassword" type="password" placeholder="Password" required>

        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAC_BjsQtA7pfoO_G"
             data-callback="onUserTurnstileSuccess">
        </div>

        <button id="userLoginBtn" disabled>Complete CAPTCHA First</button>
    </form>
</div>

<!-- Admin Login -->
<div id="adminLoginScreen" class="hidden">
    <button onclick="showSelection()">Back</button>

    <div id="adminError" class="hidden"></div>

    <form id="adminLoginForm">
        <input id="adminUsername" placeholder="Admin Username" required>
        <input id="adminPassword" type="password" required>

        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAAC_BjsQtA7pfoO_G"
             data-callback="onAdminTurnstileSuccess">
        </div>

        <button id="adminLoginBtn" disabled>Complete CAPTCHA First</button>
    </form>
</div>

</div>

<!-- ✅ External JS -->
<script type="module" src="app.js"></script>

</body>
</html>
